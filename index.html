<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf6f1">
  <title>Sallve Skin AI — Protótipo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="header">
    <button class="brand" id="brandBtn" aria-label="Início">
      <span>sallve</span><small>skin ai</small>
    </button>
    <div class="day-chip hidden" id="dayChip">
      <span class="day-pill" id="dayPill">dia 1</span>
      <button class="ff-btn" id="ffBtn">+7 dias</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="tabbar hidden" id="tabbar" aria-label="Navegação">
    <button class="tab active" data-tab="rotina"><span class="tab-icon">◷</span><span>Rotina</span></button>
    <button class="tab" data-tab="estoque"><span class="tab-icon">▢</span><span>Estoque</span></button>
    <button class="tab" data-tab="diagnostico"><span class="tab-icon">♡</span><span>Diagnóstico</span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div>
</div>
<script src="js/app.js"></script>
</body>
</html>
